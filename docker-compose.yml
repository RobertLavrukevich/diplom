version: '3.8'

services:
  # База данных
  db:
    image: mysql:8.0
    container_name: budek_db
    restart: always
    environment:
      MYSQL_DATABASE: my_review_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  # PHP-интерпретатор
  php:
    build: ./backend
    container_name: budek_php
    volumes:
      - ./backend:/var/www/html

  # Веб-сервер для PHP (Nginx)
  nginx:
    image: nginx:alpine
    container_name: budek_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # React приложение
  react:
    build: ./frontend
    container_name: budek_react
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - php